name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 22 (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🏗️ Fazer o Build do TanStack/React
        run: npm run build

      - name: ⚡ Sincronizar Capacitor pro Android
        run: npx cap sync android

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 🐘 Configurar Gradle (Anti-Falhas e Cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: 🛠️ Dar permissão pro construtor
        working-directory: ./android
        run: chmod +x gradlew

      - name: 🚀 Compilar o APK
        working-directory: ./android
        # O --no-daemon economiza memória no GitHub Actions evitando quebra de máquina
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: agryon-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk